.bd-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}

.bd-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.bd-step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;padding:26px 0;border-top:1px solid var(--line)}

.bd-step-n{font-size:52px;font-weight:200;letter-spacing:-0.05em;line-height:1;color:var(--accent)}
.bd-step-h{font-size:21px;font-weight:400;letter-spacing:-0.02em;margin-bottom:8px}

.bd-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px}

.bd-faqs{border-top:1px solid var(--line)}

.bd-plus{position:relative;flex:none;width:18px;height:18px}
.bd-plus::before,.bd-plus::after{content:'';position:absolute;left:0;top:50%;width:18px;height:1px;background:currentColor;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.bd-plus::after{transform:rotate(90deg)}
.bd-faq[open] .bd-plus::after{transform:rotate(0)}
.bd-faq p{margin:0 0 26px;max-width:680px;font-size:17px;line-height:1.65;font-weight:300;color:color-mix(in srgb,var(--fg) 78%,var(--bg))}

.bd-badgeline{display:flex;flex-wrap:wrap;gap:8px}

.bd-note{margin:0;font-size:14px;color:var(--muted)}
.bd-hero .bd-note{color:#8F8A82}
.bd-ctasec{padding:150px 0 140px}

.bd-cta-row{display:flex;flex-wrap:wrap;gap:48px;align-items:flex-end;justify-content:space-between}

.bd-ctasec .bd-btn-p{background:#0B0B0C;border-color:#0B0B0C;color:#FF5A1F}

.bd-form{display:flex;flex-direction:column;gap:22px}
.bd-form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:22px}

.bd-hero .bd-form label{color:#8F8A82}
.bd-in{height:48px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font-family:'Geist',sans-serif;font-size:18px;font-weight:300;letter-spacing:-0.01em;text-transform:none;border-radius:0;padding:0}

textarea.bd-in{height:auto;min-height:56px;padding:10px 0;resize:vertical;line-height:1.5}

.bd-hero .bd-in:focus{border-bottom-color:#FF5A1F}
.bd-form .bd-btn-lg{align-self:flex-start}
.bd-ok{margin:0;font-size:16px;line-height:1.5;color:var(--accent)}

.bd-me{display:flex;align-items:center;gap:14px;margin-top:36px;font-size:16px}
.bd-me img{width:56px;height:56px;border-radius:50%;object-fit:cover;filter:grayscale(1)}
/* project cards */
.bd-pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:48px 28px}
.bd-pcard{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit}

.bd-tag{position:absolute;left:14px;top:14px;color:#0B0B0C;padding:7px 12px;border-radius:999px;font-size:10.5px}

.bd-pcard p{margin:0;font-size:15px;line-height:1.55;font-weight:300;color:color-mix(in srgb,var(--fg) 72%,var(--bg))}
@keyframes bd-cardin{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.bd-pcard-in{animation:bd-cardin .7s cubic-bezier(.2,.8,.2,1) backwards}
.bd-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:56px;position:sticky;top:86px;z-index:5;padding:10px 0}
.bd-filter{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:inherit;font:inherit;font-size:14px;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.bd-filter .bd-mono{color:var(--muted);font-size:11px}
.bd-filter[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bd-filter[aria-pressed="true"] .bd-mono{color:color-mix(in srgb,var(--bg) 60%,var(--fg))}
.bd-fdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
/* case study */
.bd-case-hero{min-height:0;justify-content:flex-start;background:#0B0B0C}
.bd-case-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px}
.bd-picker{display:inline-flex;align-items:center;gap:12px;color:#8F8A82}
.bd-picker select{height:40px;padding:0 14px;border-radius:999px;border:1px solid #3A3833;background:transparent;color:#EDE8DF;font-family:'Geist',sans-serif;font-size:14px;max-width:280px}
.bd-case-ind{display:flex;align-items:center;gap:10px;color:#BDB7AD}
.bd-case-h1{font-size:clamp(40px,5.6vw,92px);animation:bd-cardin 1s cubic-bezier(.2,.8,.2,1)}
.bd-case-sum{margin:0;max-width:720px;font-size:clamp(18px,1.6vw,22px);line-height:1.55;font-weight:300;color:#CFC9BF}

.bd-facts-band{padding:56px 0 70px}

.bd-factrow dt{color:var(--muted);margin-bottom:8px}
.bd-factrow dd{margin:0;font-size:16px;font-weight:300;line-height:1.45}
.bd-fact-wide{grid-column:span 2}
.bd-gal{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:24px;align-items:end}
.bd-gal-a,.bd-gal-b{border-radius:20px;overflow:hidden;background:#16244A}
.bd-gal-a{aspect-ratio:16/11}.bd-gal-b{aspect-ratio:3/4}
.bd-gal img{width:100%;height:100%;object-fit:cover;display:block}
.bd-bigq{margin:0;font-size:clamp(30px,4.2vw,64px);font-weight:200;line-height:1.08;letter-spacing:-0.045em;max-width:1100px}
.bd-next{padding:110px 0 120px}
.bd-nextbtn{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l i" "n i";gap:10px 40px;align-items:end;text-align:left;border:0;border-top:1px solid var(--line);padding:40px 0 0;background:transparent;color:inherit;font:inherit;cursor:pointer}
.bd-nextbtn .bd-mono{grid-area:l;color:var(--muted)}
.bd-next-name{grid-area:n;font-size:clamp(40px,6.4vw,110px);font-weight:200;letter-spacing:-0.055em;line-height:1;transition:color .3s}
.bd-nextbtn:hover .bd-next-name{color:var(--accent)}
.bd-next-img{grid-area:i;width:clamp(140px,22vw,320px);aspect-ratio:4/3;border-radius:16px;overflow:hidden;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.bd-nextbtn:hover .bd-next-img{transform:rotate(-3deg) scale(1.04)}
.bd-next-img img{width:100%;height:100%;object-fit:cover;display:block}
/* footer */
.bd-foot{padding:110px 0 36px}
.bd-foot-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:48px;padding-bottom:72px;border-bottom:1px solid var(--line)}
.bd-foot-mail{font-size:clamp(30px,4.6vw,72px);font-weight:200;letter-spacing:-0.045em;text-decoration:none;line-height:1;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .6s cubic-bezier(.2,.8,.2,1);padding-bottom:6px}
.bd-foot-mail:hover{background-size:100% 1px;color:var(--accent)}
.bd-foot-cols{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:40px}
.bd-foot-cols div{display:flex;flex-direction:column;gap:10px;font-size:15px;font-weight:300}
.bd-foot-cols a{text-decoration:none;opacity:.8}.bd-foot-cols a:hover{opacity:1;color:var(--accent)}
.bd-foot-cols .bd-mono{color:var(--muted);margin-bottom:6px}
.bd-foot-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-top:28px;font-size:13px;color:var(--muted)}
.bd-foot-line{max-width:520px;font-size:16px;line-height:1.6;font-weight:300;color:var(--muted);margin:22px 0 0}
@media (max-width: 900px){

 .bd-gal{grid-template-columns:1fr 1fr}
 .bd-fact-wide{grid-column:auto}
 .bd-foot-cols{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 760px){

 .bd-sec{padding:90px 0}

 .bd-row{grid-template-columns:1fr;gap:6px}

 .bd-step-n{font-size:38px}
 .bd-filters{top:70px;flex-wrap:nowrap;overflow-x:auto;margin-left:-20px;margin-right:-20px;padding-left:20px;padding-right:20px}
 .bd-filter{flex:none}
 .bd-nextbtn{grid-template-columns:1fr;grid-template-areas:"l" "n" "i"}
}
@media (prefers-reduced-motion: reduce){.bd-pcard-in,.bd-case-h1{animation:none}}
